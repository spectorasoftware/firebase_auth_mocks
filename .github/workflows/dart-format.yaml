name: Dart Format

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - master

jobs:
  format:
    runs-on: ubuntu-latest
    container:
      image: google/dart:latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - run: dart format ./ --set-exit-if-changed
